version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: london_homes_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: london2024
      POSTGRES_DB: london_homes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: london_homes_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data: